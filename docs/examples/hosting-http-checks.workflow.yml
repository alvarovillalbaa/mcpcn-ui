name: MCPCN public HTTP delivery checks
"on":
  create:
permissions:
  contents: read
jobs:
  public-http:
    if: >-
      github.event_name == 'create' && github.event.ref_type == 'branch' &&
      github.repository == 'alvarovillalbaa/mcpcn-ui' &&
      github.event.repository.private == false &&
      github.event.ref == 'qa/mcpcn-public-http-20261104' &&
      github.ref == 'refs/heads/qa/mcpcn-public-http-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      HARDCODED_APPLICATION_SOURCE: REPLACE_WITH_REVIEWED_PRODUCTION_APPLICATION_COMMIT
    steps:
      - name: Require the reviewed application pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HARDCODED_APPLICATION_SOURCE" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HARDCODED_APPLICATION_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Verify five fixed anonymous public responses
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";

          const ORIGIN = "https://mcpcn-ui.vercel.app", LIMIT = 6 * 1024 * 1024;
          const CASES = [
            { name: "/", html: true },
            { name: "/docs", html: true },
            { name: "/schema/config.json", source: "registry/config.schema.json" },
            { name: "/r/button.json", source: "registry/items/button.json" },
            { name: "/r/registry.json", source: "registry/registry.json" },
          ];
          const sha = bytes => createHash("sha256").update(bytes).digest("hex");
          const need = (condition, code) => { if (!condition) throw new Error(code); };
          const canonical = value => Array.isArray(value) ? value.map(canonical) : value && typeof value === "object"
            ? Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])])) : value;
          const semantic = bytes => JSON.stringify(canonical(JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes))));
          const sourceSha = process.env.HARDCODED_APPLICATION_SOURCE;
          const rows = CASES.map(test => ({ name: test.name, status: "not_run", authSent: false, shareLink: false }));
          const report = { schemaVersion: "mcpcn.public-http.v1", sourceSha, sourceVerified: false,
            status: "failed", readiness: "public-http-unverified", origin: ORIGIN, authSent: false, shareLink: false,
            startedAtUtc: new Date().toISOString(), runtime: { node: process.version, platform: process.platform },
            limits: { requestSeconds: 15, globalSeconds: 60, finalStdoutSeconds: 2, responseBytes: LIMIT, reportBytes: 16384 },
            requestsSettled: false, checks: rows,
            proofLimits: ["Anonymous HTTP/artifact checks only; no browser JavaScript, interaction, accessibility, npm release or live MCP acceptance.",
              "Source SHA identifies the checked-out comparison baseline; provider deployment-to-source mapping is verified separately."] };
          const abort = new AbortController(); let finished = false;
          const finish = error => {
            if (finished) return; finished = true; clearTimeout(globalTimer); abort.abort();
            if (error) report.error = error;
            report.completedAtUtc = new Date().toISOString();
            report.status = !error && report.sourceVerified && report.requestsSettled && rows.length === 5 && rows.every(row => row.status === "passed") ? "passed" : "failed";
            report.readiness = report.status === "passed" ? "public-http-verified" : "public-http-unverified";
            let output = JSON.stringify(report);
            if (Buffer.byteLength(output) > 16384) {
              report.status = "failed"; report.readiness = "public-http-unverified";
              output = JSON.stringify({ schemaVersion: report.schemaVersion, sourceSha, status: "failed", readiness: report.readiness,
                error: "report_limit", authSent: false, shareLink: false, checks: rows.map(row => ({ name: row.name, status: row.status })) });
            }
            const timer = setTimeout(() => { process.stdout.destroy(); process.exit(1); }, 2000);
            process.stdout.write(output + "\n", error => { clearTimeout(timer); process.exit(!error && report.status === "passed" && Buffer.byteLength(output) <= 16384 ? 0 : 1); });
          };
          // A stalled cancellation is a failed, unsettled result, never HTTP proof.
          const globalTimer = setTimeout(() => finish("global_timeout"), 60000);
          function attributes(tag) {
            return Object.fromEntries([...tag.matchAll(/([^\s=/>]+)\s*=\s*(["'])(.*?)\2/gs)].map(match => [match[1].toLowerCase(), match[3]]));
          }
          async function check(test, row) {
            const own = new AbortController(), expires = Date.now() + 15000;
            const timer = setTimeout(() => own.abort(), 15000);
            const signal = AbortSignal.any([abort.signal, own.signal]); let reader;
            try {
              row.status = "running";
              const response = await fetch(ORIGIN + test.name, { method: "GET", credentials: "omit", redirect: "error", signal,
                headers: { accept: test.html ? "text/html" : "application/json" }, cache: "no-store" });
              row.httpStatus = response.status; row.contentType = (response.headers.get("content-type") ?? "").slice(0, 128);
              row.effectiveOrigin = new URL(response.url).origin; reader = response.body?.getReader();
              need(response.status === 200, "http_status"); need(row.effectiveOrigin === ORIGIN, "effective_origin");
              need(test.html ? /^text\/html(?:;|$)/i.test(row.contentType) : /^application\/json(?:;|$)/i.test(row.contentType), "content_type");
              need(reader, "body_missing");
              const chunks = []; let total = 0;
              while (true) {
                const part = await reader.read(); if (part.done) break;
                total += part.value.byteLength; row.bodyBytes = total;
                need(total <= LIMIT, "body_limit"); chunks.push(part.value);
              }
              const body = Buffer.concat(chunks); row.bodyBytes = body.length; row.bodySha256 = sha(body); row.bodyComplete = true;
              if (test.html) {
                const html = new TextDecoder("utf-8", { fatal: true }).decode(body), head = /<head\b[^>]*>([\s\S]*?)<\/head>/i.exec(html)?.[1] ?? "";
                const descriptions = [...head.matchAll(/<meta\b[^>]*>/gi)].map(match => attributes(match[0])).filter(meta => meta.name?.toLowerCase() === "description");
                row.descriptionMatches = descriptions.length === 1 && descriptions[0].content === "React components and workflow blocks for human-controlled MCP Apps."
                  && !/production-ready/i.test(descriptions[0].content);
                row.securityLink = [...html.matchAll(/<a\b[^>]*>/gi)].some(match => attributes(match[0]).href === "https://github.com/alvarovillalbaa/mcpcn-ui/blob/main/SECURITY.md");
                need(row.descriptionMatches && row.securityLink, "html_delivery_markers");
                if (test.name === "/") { row.publicPackageReleasePending = html.includes("Public package release pending."); need(row.publicPackageReleasePending, "home_release_marker"); }
                if (test.name === "/docs") { row.packageReleasePending = html.includes("Package release pending."); need(row.packageReleasePending, "docs_release_marker"); }
              } else {
                const stat = fs.lstatSync(test.source); need(stat.isFile() && !stat.isSymbolicLink() && stat.size <= LIMIT, "source_file_invalid");
                const source = fs.readFileSync(test.source), expected = semantic(source), actual = semantic(body);
                row.sourceFile = test.source; row.sourceBytes = source.length; row.sourceFileSha256 = sha(source);
                row.sourceSemanticSha256 = sha(expected); row.responseSemanticSha256 = sha(actual); row.semanticMatch = expected === actual;
                need(row.semanticMatch, "json_semantics");
                if (test.name === "/r/registry.json") { row.items = JSON.parse(actual).items?.length; need(row.items === 79, "registry_item_count"); }
              }
              need(!signal.aborted && Date.now() <= expires, "request_deadline"); row.status = "passed";
            } catch (error) {
              row.status = "failed"; row.error = /^[a-z0-9_]+$/.test(error?.message ?? "") ? error.message : "request_or_validation_failed";
              if (/^[A-Z0-9_]+$/.test(error?.cause?.code ?? "")) row.transportCode = error.cause.code.slice(0, 64);
            } finally {
              if (reader) { try { await reader.cancel(); } catch {} try { reader.releaseLock(); row.streamReleased = true; } catch { row.streamReleased = false; row.status = "failed"; } }
              clearTimeout(timer);
              if (signal.aborted || Date.now() > expires) { row.status = "failed"; row.error ??= "request_deadline"; }
            }
          }
          try {
            need(process.version === "v24.21.0" && /^[a-f0-9]{40}$/.test(sourceSha ?? ""), "runtime_or_source_pin");
            const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8", timeout: 10000, killSignal: "SIGKILL", maxBuffer: 1024, stdio: ["ignore", "pipe", "pipe"] }).trim();
            need(head === sourceSha, "source_head_mismatch"); report.sourceVerified = true;
            const settled = await Promise.allSettled(CASES.map((test, index) => check(test, rows[index])));
            report.requestsSettled = settled.length === 5 && settled.every(item => item.status === "fulfilled");
            finish(report.requestsSettled ? null : "request_check_unsettled");
          } catch { finish("source_or_controller_failed"); }
          NODE
# Inactive, dependency-free HTTP check. Root replaces the source placeholder
# with the exact reviewed production application commit, publishes the active
# copy on main [skip ci], then creates only qa/mcpcn-public-http-20261104.
# No browser, auth/share link, package installation, cache or artifact upload.

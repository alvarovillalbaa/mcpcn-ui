name: Focused source installation checks
"on":
  workflow_dispatch:
    inputs:
      source_commit:
        description: Approved immutable source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      MCPCN_APPROVED_SOURCE: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
      - name: Verify the approved source before execution
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import { execFileSync } from "node:child_process";
          const expected = process.env.MCPCN_APPROVED_SOURCE;
          if (!/^[a-f0-9]{40}$/.test(expected ?? "") || execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim() !== expected) {
            throw new Error("Checkout does not match the approved immutable source.");
          }
          const seal = JSON.parse(fs.readFileSync("docs/results/2026/10-29/source-inventory.json", "utf8"));
          for (const file of seal.source_files) {
            if (file.path.startsWith("/") || file.path.split("/").includes("..")) throw new Error("Invalid prepared source path.");
            const bytes = fs.readFileSync(file.path);
            if (bytes.length !== file.bytes || crypto.createHash("sha256").update(bytes).digest("hex") !== file.sha256) {
              throw new Error("Prepared source differs before execution.");
            }
          }
          NODE
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install the existing lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcpcn-reports" "$RUNNER_TEMP/mcpcn-packages"
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/mcpcn-reports/install.log"
      - name: Build the seven required packages
        run: |
          set -euo pipefail
          for package in @mcpcn/core @mcpcn/schemas @mcpcn/runtime @mcpcn/react @mcpcn/themes @mcpcn/registry mcpcn; do
            pnpm --filter "$package" build
          done 2>&1 | tee "$RUNNER_TEMP/mcpcn-reports/packages.log"
          git diff --exit-code -- registry
      - name: Run the exact 52 authored cases
        run: |
          set -euo pipefail
          pnpm exec vitest run --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$RUNNER_TEMP/mcpcn-reports/unit.json" \
            packages/registry/src/source-registry.test.ts \
            packages/cli/src/installer.test.ts \
            packages/react/src/blocks.test.tsx \
            apps/docs/components/configurator.test.tsx \
            2>&1 | tee "$RUNNER_TEMP/mcpcn-reports/unit.log"
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const expected = JSON.parse(fs.readFileSync("docs/results/2026/10-29/source-inventory.json", "utf8"));
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/mcpcn-reports/unit.json", "utf8"));
          const names = expected.test_files.flatMap(file => file.case_names).sort();
          const cases = report.testResults.flatMap(file => file.assertionResults);
          if (names.length !== 52 || cases.length !== 52 || cases.some(item => item.status !== "passed") ||
              JSON.stringify(cases.map(item => item.title).sort()) !== JSON.stringify(names)) {
            throw new Error("Focused case discovery or outcomes differ from the frozen 52-case scope.");
          }
          NODE
      - name: Build docs and prepare local package artifacts
        run: |
          set -euo pipefail
          pnpm --filter @mcpcn/docs build 2>&1 | tee "$RUNNER_TEMP/mcpcn-reports/docs.log"
          for directory in core schemas runtime react themes registry cli; do
            pnpm --dir "packages/$directory" pack --pack-destination "$RUNNER_TEMP/mcpcn-packages"
          done 2>&1 | tee "$RUNNER_TEMP/mcpcn-reports/pack.log"
      - name: Compile the two disposable consumers
        env:
          MCPCN_CONSUMER_REPORT: ${{ runner.temp }}/mcpcn-reports/consumers.json
        run: |
          set -euo pipefail
          pnpm exec tsx tooling/verify-consumers.ts "$RUNNER_TEMP/mcpcn-packages" \
            2>&1 | tee "$RUNNER_TEMP/mcpcn-reports/consumers.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-installation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mcpcn-reports/
            ${{ runner.temp }}/mcpcn-packages/
          retention-days: 7

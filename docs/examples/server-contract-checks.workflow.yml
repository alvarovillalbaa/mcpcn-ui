name: MCPCN server contract
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact server-contract candidate commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mcpcn-server-contract-checks
  cancel-in-progress: false
jobs:
  server_contract:
    if: github.repository == 'alvarovillalbaa/mcpcn-ui' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      SOURCE_COMMIT: ${{ inputs.source_sha }}
      MCPCN_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Focused authored checks and owned cleanup
        run: node tooling/run-server-contract-checks.mjs --source-commit "$SOURCE_COMMIT"
      - name: Retain original packet on success or failure
        if: always() && env.MCPCN_SERVER_PACKET != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcpcn-server-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MCPCN_SERVER_PACKET }}
          if-no-files-found: error
          retention-days: 1

name: MCPCN public release installation checks
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact candidate source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  public-installation:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ inputs.source_sha }}
      MCPCN_PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
      - name: Check public archive installation in owned scratch
        run: node tooling/run-public-release-install-checks.mjs --source-commit "$SOURCE_COMMIT"
      - name: Retain safe original evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcpcn-public-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MCPCN_PUBLIC_INSTALL_PACKET }}
          if-no-files-found: error
          retention-days: 1
